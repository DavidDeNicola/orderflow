name: CI order-service

on:
  push:
    branches: [ main ]
    paths:
      - 'order-service/**'
      - '.github/workflows/ci-order-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'order-service/**'
      - '.github/workflows/ci-order-service.yml'

jobs:
  test:
    name: Test order-service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: order-service

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Installa Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: order-service/pom.xml

      - name: Esegui i test
        run: mvn -B test