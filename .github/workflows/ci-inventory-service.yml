name: CI inventory-service

on:
  push:
    branches: [ main ]
    paths:
      - 'inventory-service/**'
      - '.github/workflows/ci-inventory-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'inventory-service/**'
      - '.github/workflows/ci-inventory-service.yml'

jobs:
  test:
    name: Test inventory-service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inventory-service

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Installa Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: inventory-service/pom.xml

      - name: Esegui i test
        run: mvn -B test

  publish:
    name: Pubblica immagine su GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepara Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push dell'immagine
        uses: docker/build-push-action@v6
        with:
          context: ./inventory-service
          push: true
          tags: |
            ghcr.io/daviddenicola/orderflow-inventory-service:${{ github.sha }}
            ghcr.io/daviddenicola/orderflow-inventory-service:main
          cache-from: type=gha,scope=inventory-service
          cache-to: type=gha,mode=max,scope=inventory-service